# nginx site for tabby-sync behind an existing nginx.
# Replace sync.example.com and the certificate paths, then:
#   cp tabby-sync.conf /etc/nginx/sites-available/ && ln -s ../sites-available/tabby-sync.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;
    # Keep this location if certbot renews via the webroot method.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen ... http2" works on every nginx in current distros; nginx 1.25.1+
    # prefers a separate "http2 on;" and only warns about this form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.example.com;

    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # The server allows 2 MiB configs; the JSON of API v1 can be larger.
    # nginx's default of 1 MiB would reject big uploads with 413.
    client_max_body_size 8m;

    # The app sets HSTS, CSP and the other security headers itself; adding
    # them here as well would send duplicates.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host is checked against Origin for CSRF protection.
        proxy_set_header Host $host;
        # Overwrite, don't append: the client cannot inject addresses.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
