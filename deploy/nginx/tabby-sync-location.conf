# tabby-sync under a path of an existing server block, e.g. https://example.com/services/tabby-sync/
# Requires TABBYSYNC_BASE_PATH=/services/tabby-sync in deploy/.env (the app strips the prefix itself,
# scopes its cookies to it and leaves HSTS to this server block). Paste inside the "server { ... }".

location = /services/tabby-sync { return 301 /services/tabby-sync/; }

location /services/tabby-sync/ {
    # No URI part: the request reaches the app with the prefix intact.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Host is checked against Origin for CSRF protection.
    proxy_set_header Host $host;
    # Overwrite, don't append: the client cannot inject addresses.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Configs can be 2 MiB, more as JSON; nginx's default is 1 MiB.
    client_max_body_size 8m;
    # Pages carry CSRF tokens; don't compress them (BREACH).
    gzip off;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
