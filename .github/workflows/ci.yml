# Third-party actions are referenced by tag; pin them to commit SHAs
# (Dependabot/Renovate can maintain the pins).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # setup-go v7 reads the toolchain directive, so the exact Go
          # version from go.mod is installed once.
          go-version-file: go.mod
      - name: download modules
        # Retried: a transient proxy or network failure should not fail CI.
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying"
            sleep 15
          done
          exit 1
      - run: go mod verify
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test (race, Postgres via testcontainers)
        env:
          TABBYSYNC_REQUIRE_DB: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: fuzz smoke
        run: go test -run=^$ -fuzz=FuzzValidateContent -fuzztime=30s ./internal/configs

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image references must be lowercase (the owner may not be), and a
      # tag cannot contain "/" (a pull request's ref_name is "<n>/merge"):
      # releases are tagged with the git tag, other builds with the commit.
      - id: meta
        name: image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          provenance: mode=max
          sbom: true
      # No floating major tag exists for this action; use an exact version.
      - uses: sigstore/cosign-installer@v4.1.2
        if: startsWith(github.ref, 'refs/tags/v')
      - name: sign image
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
